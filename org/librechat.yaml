webSearch:
  serperApiKey: "${SERPER_API_KEY}"       # Klucz API Serper (search provider)
  firecrawlApiKey: "${FIRECRAWL_API_KEY}" # Klucz API Firecrawl (scraper)
  jinaApiKey: "${JINA_API_KEY}"           # Klucz API Jina (reranker)

  searchProvider: "serper"   # Możesz wybrać "serper" lub "searxng"
  scraperType: "firecrawl"   # Obecnie jedyna opcja
  rerankerType: "jina"       # Możesz wybrać "jina" lub "cohere"

  safeSearch: 1              # Filtry bezpieczeństwa (0, 1, 2)
  scraperTimeout: 9500       # Timeout dla scrapera w ms
# Definition of custom endpoints
endpoints:
  # assistants:
  #   disableBuilder: false # Disable Assistants Builder Interface by setting to `true`
  #   pollIntervalMs: 3000  # Polling interval for checking assistant updates
  #   timeoutMs: 180000  # Timeout for assistant operations
  #   # Should only be one or the other, either `supportedIds` or `excludedIds`
  #   supportedIds: ["asst_supportedAssistantId1", "asst_supportedAssistantId2"]
  #   # excludedIds: ["asst_excludedAssistantId"]
  #   # Only show assistants that the user created or that were created externally (e.g. in Assistants playground).
  #   # privateAssistants: false # Does not work with `supportedIds` or `excludedIds`
  #   # (optional) Models that support retrieval, will default to latest known OpenAI models that support the feature
  #   retrievalModels: ["gpt-4-turbo-preview"]
  #   # (optional) Assistant Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
  #   capabilities: ["code_interpreter", "retrieval", "actions", "tools", "image_vision"]
  # agents:
  #   # (optional) Default recursion depth for agents, defaults to 25
  #   recursionLimit: 50
  #   # (optional) Max recursion depth for agents, defaults to 25
  #   maxRecursionLimit: 100
  #   # (optional) Disable the builder interface for agents
  #   disableBuilder: false
  #   # (optional) Maximum total citations to include in agent responses, defaults to 30
  #   maxCitations: 30
  #   # (optional) Maximum citations per file to include in agent responses, defaults to 7
  #   maxCitationsPerFile: 7
  #   # (optional) Minimum relevance score for sources to be included in responses, defaults to 0.45 (45% relevance threshold)
  #   # Set to 0.0 to show all sources (no filtering), or higher like 0.7 for stricter filtering
  #   minRelevanceScore: 0.45
  #   # (optional) Agent Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
  #   capabilities: ["memory", "personalize", "execute_code", "file_search", "actions", "tools"]
  agents:
    # (optional) Default recursion depth for agents, defaults to 25
    # recursionLimit: 50
    # (optional) Max recursion depth for agents, defaults to 25
    # maxRecursionLimit: 100
    # (optional) Disable the builder interface for agents
    # disableBuilder: false
    # (optional) Maximum total citations to include in agent responses, defaults to 30
    # maxCitations: 30
    # (optional) Maximum citations per file to include in agent responses, defaults to 7
    # maxCitationsPerFile: 7
    # (optional) Minimum relevance score for sources to be included in responses, defaults to 0.45 (45% relevance threshold)
    # Set to 0.0 to show all sources (no filtering), or higher like 0.7 for stricter filtering
    # minRelevanceScore: 0.45
    # (optional) Agent timeout in milliseconds - increased for MCP operations
    timeoutMs: 600000
  #   # (optional) Agent Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
  #   capabilities: ["memory", "personalize", "execute_code", "file_search", "actions", "tools"]
  custom:
    # Groq Example
    - name: 'groq'
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1/'
      models:
        default:
          [
            'llama3-70b-8192',
            'llama3-8b-8192',
            'llama2-70b-4096',
            'mixtral-8x7b-32768',
            'gemma-7b-it',
          ]
        fetch: false
      titleConvo: true
      titleModel: 'mixtral-8x7b-32768'
      modelDisplayLabel: 'groq'

    # Mistral AI Example
    - name: 'Mistral' # Unique name for the endpoint
      # For `apiKey` and `baseURL`, you can use environment variables that you define.
      # recommended environment variables:
      apiKey: '${MISTRAL_API_KEY}'
      baseURL: 'https://api.mistral.ai/v1'

      # Models configuration
      models:
        # List of default models to use. At least one value is required.
        default: ['mistral-tiny', 'mistral-small', 'mistral-medium']
        # Fetch option: Set to true to fetch models from API.
        fetch: true # Defaults to false.

      # Optional configurations

      # Title Conversation setting
      titleConvo: true # Set to true to enable title conversation

      # Title Method: Choose between "completion" or "functions".
      # titleMethod: "completion"  # Defaults to "completion" if omitted.

      # Title Model: Specify the model to use for titles.
      titleModel: 'mistral-tiny' # Defaults to "gpt-3.5-turbo" if omitted.

      # Summarize setting: Set to true to enable summarization.
      # summarize: false

      # Summary Model: Specify the model to use if summarization is enabled.
      # summaryModel: "mistral-tiny"  # Defaults to "gpt-3.5-turbo" if omitted.

      # Force Prompt setting: If true, sends a `prompt` parameter instead of `messages`.
      # forcePrompt: false

      # The label displayed for the AI model in messages.
      modelDisplayLabel: 'Mistral' # Default is "AI" when not set.

      # Add additional parameters to the request. Default params will be overwritten.
      # addParams:
      # safe_prompt: true # This field is specific to Mistral AI: https://docs.mistral.ai/api/

      # Drop Default params parameters from the request. See default params in guide linked below.
      # NOTE: For Mistral, it is necessary to drop the following parameters or you will encounter a 422 Error:
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']

    # OpenRouter Example
    - name: 'OpenRouter'
      # For `apiKey` and `baseURL`, you can use environment variables that you define.
      # recommended environment variables:
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
          x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default: ['meta-llama/llama-3-70b-instruct']
        fetch: true
      titleConvo: true
      titleModel: 'meta-llama/llama-3-70b-instruct'
      # Recommended: Drop the stop parameter from the request as Openrouter models use a variety of stop tokens.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

    # Portkey AI Example
    - name: 'Portkey'
      apiKey: 'dummy'
      baseURL: 'https://api.portkey.ai/v1'
      headers:
        x-portkey-api-key: '${PORTKEY_API_KEY}'
        x-portkey-virtual-key: '${PORTKEY_OPENAI_VIRTUAL_KEY}'
      models:
        default: ['gpt-4o-mini', 'gpt-4o', 'chatgpt-4o-latest']
        fetch: true
      titleConvo: true
      titleModel: 'current_model'
      summarize: false
      summaryModel: 'current_model'
      forcePrompt: false
      modelDisplayLabel: 'Portkey'
      iconURL: 'https://images.crunchbase.com/image/upload/c_pad,f_auto,q_auto:eco,dpr_1/rjqy7ghvjoiu4cd1xjbf'

    # DeepSeek Configuration
    - name: "Deepseek"
      type: "openai"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-reasoner"
          - "deepseek-coder"
        fetch: false
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "Deepseek"

    - name: 'Perplexity'
      apiKey: '${PERPLEXITY_API_KEY}'
      baseURL: 'https://api.perplexity.ai'
      models:
        default: [
          "sonar",
          "sonar-pro",
          "sonar-deep-research"
        ]
        fetch: false
      headers:
        Authorization: 'Bearer ${PERPLEXITY_API_KEY}'
        Content-Type: 'application/json'
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty", "logit_bias", "top_logprobs", "logprobs", "best_of", "echo", "suffix", "web_search"]
      addParams:
        model: "sonar"
      timeout: 300000
      retry: 3
      titleConvo: true
      titleModel: 'sonar'
      modelDisplayLabel: 'Perplexity'
fileConfig:
  endpoints:
    # Agents endpoint - 10 files x 30MB each
    agents:
      fileLimit: 20  # Maximum 10 files per agent
      fileSizeLimit: 30  # Maximum 30MB per file
      totalSizeLimit: 300  # Maximum 300MB total (10 files x 30MB)
      supportedMimeTypes:
        # Images (all formats)
        - "image/.*"
        # Documents
        - "application/pdf"
        - "text/.*"
        - "application/vnd.openxmlformats-officedocument.*"
        - "application/msword"
        - "application/vnd.ms-excel"
        - "application/vnd.ms-powerpoint"
        # Audio (for transcription and analysis)
        - "audio/.*"
        # Video (for analysis and transcription)
        - "video/.*"
    # Assistants endpoint - same limits
    assistants:
      fileLimit: 10
      fileSizeLimit: 30
      totalSizeLimit: 300
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
        - "application/vnd.openxmlformats-officedocument.*"
        - "application/msword"
        - "application/vnd.ms-excel"
        - "application/vnd.ms-powerpoint"
        - "audio/.*"
        - "video/.*"
    # OpenAI endpoint - same limits
    openAI:
      fileLimit: 10
      fileSizeLimit: 30
      totalSizeLimit: 300
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
        - "application/vnd.openxmlformats-officedocument.*"
        - "audio/.*"
        - "video/.*"
    # Default for all other endpoints
    default:
      fileLimit: 10
      fileSizeLimit: 30
      totalSizeLimit: 300
  serverFileSizeLimit: 100  # Global server file size limit in MB (keep conservative for server)
  avatarSizeLimit: 2  # Limit for user avatar image size in MB
  imageGeneration:
    percentage: 100
    px: 1024
  # Client-side image resizing to prevent upload errors
  clientImageResize:
    enabled: false
    maxWidth: 1900
    maxHeight: 1900
    quality: 0.92
# See the Custom Configuration Guide for more information on Assistants Config:
# https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/assistants_endpoint

memory:
  disabled: false
  personalize: true
  tokenLimit: 50000
  messageWindowSize: 8

  validKeys:
    # === CORE PROFILE (Tożsamość) ===
    - "profile_communication"      # Style komunikacji między domenami
    - "profile_preferences"        # Preferencje globalne
    - "profile_values"             # Wartości i priorytety życiowe

    # === LEARNING & EDUCATION ===
    - "context_learning"           # Ogólny kontekst nauki
    - "context_learning_progress"  # Postępy i osiągnięcia
    - "context_learning_difficulties" # Wyzwania i trudności
    - "context_learning_methods"   # Skuteczne metody uczenia się

    # === HEALTH & THERAPY ===
    - "context_health"             # Zdrowie fizyczne i psychiczne
    - "context_health_treatment"   # Leczenie i terapia
    - "context_health_symptoms"    # Objawy i wzorce
    - "context_health_goals"       # Cele zdrowotne

    # === DEVELOPMENT & WORK ===
    - "context_development"        # Projekty i stack technologiczny
    - "context_work"               # Środowisko pracy i kariera
    - "context_projects"           # Aktywne i ukończone projekty

    # === PERSONAL & LIFESTYLE ===
    - "context_personal"           # Relacje i życie osobiste
    - "context_lifestyle"          # Styl życia i codzienne nawyki
    - "context_finances"           # Cele i sytuacja finansowa

    # === KNOWLEDGE BASE ===
    - "knowledge_technical"        # Wiedza techniczna i patterns
    - "knowledge_health"           # Strategie zdrowotne które działają
    - "knowledge_learning"         # Metody edukacyjne które działają
    - "knowledge_life"             # Rozwiązania życiowe które działają
    - "knowledge_recurring_solutions" # Top 15 rozwiązań wszystkich domen

    # === ACTIVE CONTEXT ===
    - "active_task"                # Bieżące zadania i fokus
    - "active_challenges"          # Aktualne wyzwania we wszystkich domenach
agent:
  provider: "openAI"
  type: "openai"
  model: "gpt-4o-mini"
  instructions: |
    ═══════════════════════════════════════════════════════════════
    UNIVERSAL MEMORY ASSISTANT - WHOLE PERSON APPROACH
    ═══════════════════════════════════════════════════════════════

    You are a comprehensive memory assistant for a COMPLETE PERSON
    across 4 core life domains: LEARNING, HEALTH, WORK, PERSONAL.

    TOKEN LIMIT: 50,000 tokens TOTAL - prioritize quality over quantity.

    ═══════════════════════════════════════════════════════════════
    CORE PHILOSOPHY: DOMAIN SEPARATION + CROSS-DOMAIN INSIGHTS
    ═══════════════════════════════════════════════════════════════

    Each domain is SEPARATE but you can identify CROSS-DOMAIN PATTERNS.
    Example: "Learning struggles when sleep quality drops" → record in both domains.

    ═══════════════════════════════════════════════════════════════
    KEY USAGE GUIDE - COMPREHENSIVE
    ═══════════════════════════════════════════════════════════════

    🎭 CORE PROFILE (Universal Identity)
    profile_communication:
    - HOW user communicates across all domains
    - FORMAT: "Direct in work, gentle in therapy, encouraging in learning"
    - SIZE: 300 tokens

    profile_preferences:
    - CROSS-DOMAIN preferences and styles
    - FORMAT: "Learning: hands-on. Work: deep focus. Health: evidence-based"
    - SIZE: 400 tokens

    profile_values:
    - Core life values and priorities
    - FORMAT: "Health > Career > Learning. Values: growth, balance, authenticity"
    - SIZE: 300 tokens

    🎓 LEARNING & EDUCATION DOMAIN
    context_learning:
    - General learning context and current focus
    - FORMAT: "Current: AI/ML RAG systems. Background: Python basics mastered"
    - SIZE: 2000 tokens

    context_learning_progress:
    - Detailed progress tracking with dates and metrics
    - FORMAT: "Math: fractions 90% (Nov), geometry 60% (Dec). Reading: level 4"
    - UPDATE: After each learning session
    - SIZE: 3000 tokens

    context_learning_difficulties:
    - Specific learning challenges and misconceptions
    - FORMAT: "Math: denominator confusion. Programming: async/await timing"
    - UPDATE: When patterns emerge
    - SIZE: 2000 tokens

    context_learning_methods:
    - Learning techniques that work for this person
    - FORMAT: "Visual aids for math. Project-based for programming. Breaks every 25min"
    - SIZE: 1500 tokens

    🏥 HEALTH & THERAPY DOMAIN (HIGH SENSITIVITY)
    context_health:
    - Overall health status and medical history
    - FORMAT: "ADHD diagnosed 2024. Anxiety: situational. Sleep: 6hrs avg"
    - SENSITIVE: Extreme care required
    - SIZE: 2000 tokens

    context_health_treatment:
    - Current treatments, medications, therapy approaches
    - FORMAT: "Medication: Adderall 20mg. Therapy: CBT weekly. Exercise: 3x/week"
    - UPDATE: After medical/therapy sessions
    - SIZE: 2000 tokens

    context_health_symptoms:
    - Symptom patterns, triggers, and severity tracking
    - FORMAT: "Focus: worse afternoons. Anxiety: deadlines trigger. Sleep: caffeine sensitive"
    - SIZE: 1500 tokens

    context_health_goals:
    - Health and wellness objectives
    - FORMAT: "Reduce medication dependence. Improve sleep to 7hrs. Manage work stress"
    - SIZE: 1000 tokens

    💻 DEVELOPMENT & WORK DOMAIN
    context_development:
    - Technical skills, projects, and development context
    - FORMAT: "Stack: Python/TS. Current: LibreChat memory system"
    - SIZE: 3000 tokens

    context_work:
    - Career goals, work environment, professional development
    - FORMAT: "Goal: AI engineer. Environment: remote. Development: mentorship needed"
    - SIZE: 2000 tokens

    context_projects:
    - Active and completed projects with status and learnings
    - FORMAT: "LibreChat: ongoing, learning RAG. Personal website: completed 2024"
    - SIZE: 2000 tokens

    🏠 PERSONAL & LIFESTYLE DOMAIN
    context_personal:
    - Relationships, personal goals, life events
    - FORMAT: "Family: close. Goals: work-life balance. Events: career switch planned"
    - SIZE: 2000 tokens

    context_lifestyle:
    - Daily habits, routines, and lifestyle patterns
    - FORMAT: "Exercise: morning. Diet: Mediterranean. Social: weekends"
    - SIZE: 1500 tokens

    context_finances:
    - Financial goals, situation, and planning
    - FORMAT: "Goal: emergency fund. Situation: stable. Planning: investment learning"
    - SIZE: 1000 tokens

    🧠 KNOWLEDGE BASE (What Works)
    knowledge_technical:
    - Technical patterns, solutions, architecture decisions
    - FORMAT: "Repository pattern for data. Microservices for scale. React for UI"
    - SIZE: 3000 tokens

    knowledge_health:
    - Health strategies and treatments that work
    - FORMAT: "Breathing exercises reduce anxiety. Morning exercise improves focus"
    - SIZE: 2000 tokens

    knowledge_learning:
    - Learning methods and educational approaches that work
    - FORMAT: "Spaced repetition for languages. Project-based for programming"
    - SIZE: 2000 tokens

    knowledge_life:
    - Life solutions and personal strategies that work
    - FORMAT: "Time blocking improves productivity. Weekly reviews maintain balance"
    - SIZE: 2000 tokens

    knowledge_recurring_solutions:
    - TOP 15 recurring problems + solutions across ALL domains
    - FORMAT: "1. [WORK] Timeout → retry. 2. [HEALTH] Anxiety → breathing. 3. [LEARN] Procrastination → Pomodoro..."
    - Domain tags: [WORK], [HEALTH], [LEARN], [LIFE]
    - SIZE: 3000 tokens (MOST VALUABLE KEY)

    🎯 ACTIVE CONTEXT
    active_task:
    - Current primary focus across domains
