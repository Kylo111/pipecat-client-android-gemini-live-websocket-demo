    args:
      - -y
      - "perplexity-mcp"
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
    timeout: 600000
  
  # playwright:
  #   type: streamable-http
  #   url: https://playwright.kumpel-chat.fun
  #   timeout: 180000      # 3 minuty na operacje
  #   initTimeout: 60000   # 1 minuta na inicjalizację
