# ============================================
# SPEECH CONFIGURATION - OpenAI STT/TTS
# Dokumentacja: https://librechat.ai/docs/configuration/librechat_yaml/object_structure/speech
# Ostatnia aktualizacja: October 1, 2025
# ============================================
speech:
  # ============================================
  # STT (Speech-to-Text) - OpenAI Whisper
  # ============================================
  stt:
    openai:
      apiKey: '${STT_API_KEY}'
      model: 'whisper-1'
      # url: ''  # Opcjonalne - usuń lub zostaw puste dla domyślnego OpenAI endpoint

  # ============================================
  # TTS (Text-to-Speech) - OpenAI TTS
  # ============================================
  tts:
    openai:
      apiKey: '${TTS_API_KEY}'
      model: 'tts-1-hd'  # tts-1-hd = wyższa jakość | tts-1 = szybsza generacja
      voices: ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer']
      # url: ''  # Opcjonalne - usuń lub zostaw puste dla domyślnego OpenAI endpoint

  
# rateLimits:
#   fileUploads:
#     ipMax: 100
#     ipWindowInMinutes: 60  # Rate limit window for file uploads per IP
#     userMax: 50
#     userWindowInMinutes: 60  # Rate limit window for file uploads per user
#   conversationsImport:
#     ipMax: 100
#     ipWindowInMinutes: 60  # Rate limit window for conversation imports per IP
#     userMax: 50
#     userWindowInMinutes: 60  # Rate limit window for conversation imports per user

# Example Actions Object Structure
actions:
  allowedDomains:
    - 'swapi.dev'
    - 'librechat.ai'
    - 'google.com'

# Example MCP Servers Object Structure
